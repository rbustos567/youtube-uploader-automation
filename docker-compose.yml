version: '3.8'

services:
  youtube-uploader:
    build: ./uploader-service
    container_name: youtube-uploader
    restart: unless-stopped
    volumes:
      # Map the dynamic paths generated by the installer
      - ${DEPLOY_WORKSPACE_PATH}/data:/app/data
      - ${DEPLOY_WORKSPACE_PATH}/config:/app/config
      - ${DEPLOY_WORKSPACE_PATH}/ollama:/app/ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST_URL}
    networks:
      - automation-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-automation
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ${DEPLOY_WORKSPACE_PATH}/jenkins_home:/var/jenkins_home
      # Bind mount the host's Docker socket so Jenkins can trigger 'docker exec'
      - /var/run/docker.sock:/var/run/docker.sock
      # Align system time natively
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
    networks:
      - automation-network

networks:
  automation-network:
    driver: bridge