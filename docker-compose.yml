services:
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      # Named volume ensures model weights persist separate from host system junk
      - ollama_data:/root/.ollama
    restart: unless-stopped

  youtube-uploader:
    build:
      context: ./uploader-service
      dockerfile: Dockerfile
    container_name: youtube-uploader
    tty: true
    stdin_open: true
    volumes:
      # Maps your clean repository subdirectories into the generic container execution root
      - ${DEPLOY_WORKSPACE_PATH}/uploader-service:/app
      - ${DEPLOY_WORKSPACE_PATH}/data:/app/data
      - ${DEPLOY_WORKSPACE_PATH}/config:/app/config
      - ${DEPLOY_WORKSPACE_PATH}/ollama:/app/ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama-service:11434
    restart: "no"

  jenkins-service:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins-service
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - TZ=${SYSTEM_TIMEZONE}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - PIPELINE_CRON_SCHEDULE=${PIPELINE_CRON_SCHEDULE}
      # Configuration as Code (JCasC) Dynamic Injection
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins.yaml
      - JENKINS_INITIAL_ADMIN_USER=${JENKINS_INITIAL_ADMIN_USER}
      - JENKINS_INITIAL_ADMIN_PASSWORD=${JENKINS_INITIAL_ADMIN_PASSWORD}
      - JENKINS_PROJECT_NAME=${JENKINS_PROJECT_NAME}
      - JENKINS_GITHUB_REPO_URL=${JENKINS_GITHUB_REPO_URL}
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the configuration template into the runtime execution directory
      - ./jenkins/jenkins.yaml:/var/jenkins_home/jenkins.yaml
      - ${DEPLOY_WORKSPACE_PATH}/uploader-service:/app
      - ${DEPLOY_WORKSPACE_PATH}/data:/app/data
      - ${DEPLOY_WORKSPACE_PATH}/ollama:/app/ollama
    group_add:
      - "0" # Grants 'jenkins' user privilege escalation to interact with host Docker socket
    restart: unless-stopped

volumes:
  jenkins_data:
  ollama_data:
