jenkins:
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      # Usa operadores elvis para que no intente sobreescribir con vacíos si ya se purgaron
      users:
        - id: "${JENKINS_INITIAL_ADMIN_USER}"
          password: "${JENKINS_INITIAL_ADMIN_PASSWORD}"

unclassified:
  location:
    url: "http://localhost:8080/"

# ==============================================================================
# CREDENCIALES CONFIGURADAS DE FORMA SEGURA CON FALLBACKS
# ==============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              # Si está vacío, le asignamos un ID genérico para que no truene JCasC
              id: "${NOTIFICATION_CREDENTIAL_ID:-disabled-smtp-token}"
              description: "Google Application Password for SMTP alerts"
              # Si está vacío, la credencial se guarda con el texto "DISABLED"
              secret: "${GMAIL_APP_PASSWORD:-DISABLED}"

# GitOps Engine: This block provisions your pipeline job automatically on startup
jobs:
  - script: >
      pipelineJob("${JENKINS_PROJECT_NAME}") {
        description("Automated high-definition video processing and YouTube deployment pipeline.")
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("${JENKINS_GITHUB_REPO_URL}")
                }
                branches('main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
      }